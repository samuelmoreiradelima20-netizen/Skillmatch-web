<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkillMatch é uma aplicação que analisa a compatibilidade entre o perfil de um candidato e vagas de emprego.">
    <title>SkillMatch | Compatibilidade com vagas de Front-end</title>
    <link rel="stylesheet" href="./assets/styles/index.style.css">
</head>

<body>
 <header>
    <img
        src="./assets/img/skillmatch.svg"
        alt="Logo do SkillMatch"
        class="logo"
    >

    <h1>SkillMatch</h1>

    <p>encontre vagas compatíveis com seu perfil.</p>

    <nav aria-label="Navegação principal">
        <a href="#profile-form">Perfil</a>
        <a href="#results">Vagas</a>
    </nav>
</header>
<main>
    <section>
        <h2>Seu perfil</h2>
        <p>Preencha seus dados para encontrar vagas compatíveis.</p>
        <form id="profile-form"> 
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required>

            <label for="area">Área de interesse:</label>
            <input type="text" id="area" name="area" required>

            <label for="skills">Habilidades:</label>
            <input type="text" id="skills" name="skills" required>

            <label for="experience">Experiência (em anos):</label>
            <input type="number" id="experience" name="experience" min="0" required>

            <button type="submit">Analisar vagas</button>
        </form>
    </section>

    <section>
        <h2>Vagas compatíveis</h2>
        <div id="results"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 SkillMatch</p>
</footer>
<script type="module" src="./assets/scripts/main.js"></script>
</body>

</html>
